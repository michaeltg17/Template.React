name: ci

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build CI Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ci
          push: false
          load: true
          tags: template-ci:latest
          cache-from: type=gha,scope=template-ci
          cache-to: type=gha,mode=max,scope=template-ci

      - name: Run CI checks
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8090/api
          NEXT_PUBLIC_ENABLE_API_MOCKING: true
          NEXT_PUBLIC_URL: http://localhost:3000
          NEXT_PUBLIC_MOCK_API_PORT: 8090
        run: docker run --rm -e NEXT_PUBLIC_API_URL -e NEXT_PUBLIC_ENABLE_API_MOCKING -e NEXT_PUBLIC_URL -e NEXT_PUBLIC_MOCK_API_PORT -v /var/run/docker.sock:/var/run/docker.sock template-ci:latest

      - name: Verify production build environment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          NEXT_PUBLIC_API_URL_DEV: ${{ vars.NEXT_PUBLIC_API_URL_DEV }}
          NEXT_PUBLIC_API_URL_QA: ${{ vars.NEXT_PUBLIC_API_URL_QA }}
          NEXT_PUBLIC_API_URL_PROD: ${{ vars.NEXT_PUBLIC_API_URL_PROD }}
        run: |
          for name in NEXT_PUBLIC_API_URL_DEV NEXT_PUBLIC_API_URL_QA NEXT_PUBLIC_API_URL_PROD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repo variable $name is not set. Refusing to publish an image that would bake in the wrong API URL."
              exit 1
            fi
          done

      - name: Compute short SHA
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: sha
        run: echo "sha7=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dev image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL_DEV }}
          tags: ghcr.io/${{ github.repository_owner }}/template-react:dev-${{ steps.sha.outputs.sha7 }}
          cache-from: type=gha,scope=template-production
          cache-to: type=gha,mode=max,scope=template-production

      - name: Build and push qa image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL_QA }}
          tags: ghcr.io/${{ github.repository_owner }}/template-react:qa-${{ steps.sha.outputs.sha7 }}
          cache-from: type=gha,scope=template-production
          cache-to: type=gha,mode=max,scope=template-production

      - name: Build and push prod image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL_PROD }}
          tags: ghcr.io/${{ github.repository_owner }}/template-react:prod-${{ steps.sha.outputs.sha7 }}
          cache-from: type=gha,scope=template-production
          cache-to: type=gha,mode=max,scope=template-production

      - name: Extract PR number from merge commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: extract-pr
        run: |
          MERGE_MSG=$(git log -1 --format=%B)
          PR_NUMBER=$(echo "$MERGE_MSG" | grep -oP '#\K[0-9]+' | head -1)
          echo "PR number: $PR_NUMBER"
          if [ -z "$PR_NUMBER" ]; then
            echo "::warning::No PR number found in merge commit message: $MERGE_MSG"
            exit 1
          fi
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

      - name: Fetch PR title and notes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: pr-notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::group::Fetching PR #${{ steps.extract-pr.outputs.pr_number }}"
          PR_JSON=$(gh pr view ${{ steps.extract-pr.outputs.pr_number }} --json title,body)
          PR_TITLE=$(echo "$PR_JSON" | jq -r '.title')
          PR_BODY=$(echo "$PR_JSON" | jq -r '.body')
          echo "::endgroup::"
          echo "pr_title=$PR_TITLE" >> $GITHUB_OUTPUT
          echo "$PR_BODY" > release-notes.txt
          cat release-notes.txt

      - name: Create tag and GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.sha.outputs.sha7 }}" \
            --target ${{ github.sha }} \
            --title "${{ steps.pr-notes.outputs.pr_title }}" \
            --notes-file release-notes.txt \
            --latest
