name: ci

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build CI Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ci
          push: false
          load: true
          tags: template-ci:latest
          cache-from: type=gha,scope=template-ci
          cache-to: type=gha,mode=max,scope=template-ci

      - name: Run CI checks
        env:
          API_URL: http://localhost:8090/api
          APP_URL: http://localhost:3000
          MOCK_API_PORT: 8090
        run: docker run --rm -e API_URL -e APP_URL -e MOCK_API_PORT -v /var/run/docker.sock:/var/run/docker.sock template-ci:latest

      - name: Compute short SHA
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: sha
        run: echo "sha7=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/template-react:${{ steps.sha.outputs.sha7 }}
            ghcr.io/${{ github.repository_owner }}/template-react:latest
          cache-from: type=gha,scope=template-production
          cache-to: type=gha,mode=max,scope=template-production

      - name: Validate image starts with runtime API_URL only
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker build -t template-validate .
          docker run -d -p 3111:3000 -e API_URL=http://127.0.0.1:59999/api --name template-validate template-validate
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3111/ >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -sf http://localhost:3111/ >/dev/null
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3111/api/products)
          if [ "$status" != "502" ]; then
            echo "::error::Expected 502 from the API proxy (backend intentionally unreachable), got $status"
            exit 1
          fi
          docker rm -f template-validate >/dev/null

      - name: Extract PR number from merge commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: extract-pr
        run: |
          MERGE_MSG=$(git log -1 --format=%B)
          PR_NUMBER=$(echo "$MERGE_MSG" | grep -oP '#\K[0-9]+' | head -1)
          echo "PR number: $PR_NUMBER"
          if [ -z "$PR_NUMBER" ]; then
            echo "::warning::No PR number found in merge commit message: $MERGE_MSG"
            exit 1
          fi
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

      - name: Fetch PR title and notes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: pr-notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::group::Fetching PR #${{ steps.extract-pr.outputs.pr_number }}"
          PR_JSON=$(gh pr view ${{ steps.extract-pr.outputs.pr_number }} --json title,body)
          PR_TITLE=$(echo "$PR_JSON" | jq -r '.title')
          PR_BODY=$(echo "$PR_JSON" | jq -r '.body')
          echo "::endgroup::"
          echo "pr_title=$PR_TITLE" >> $GITHUB_OUTPUT
          echo "$PR_BODY" > release-notes.txt
          cat release-notes.txt

      - name: Create tag and GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.sha.outputs.sha7 }}" \
            --target ${{ github.sha }} \
            --title "${{ steps.pr-notes.outputs.pr_title }}" \
            --notes-file release-notes.txt \
            --latest
